[supervisord]
nodaemon=true
logfile=/var/log/bidvolt/supervisord.log
loglevel=info
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/local/bin/bidvolt-postgres
user=postgres
autorestart=true
priority=1
stopasgroup=true
stopsignal=INT

# ClamAV 扫描：virus_scan_required=1 时启用（需先就绪 /var/run/clamav 与病毒库）
# [program:clamd]
# command=/usr/sbin/clamd --config-file=/etc/clamav/clamd.conf
# user=clamav
# autorestart=true
# priority=3
# stopasgroup=true

[program:app]
command=/opt/bidvolt/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8123 --workers 1
directory=/opt/bidvolt
environment=PYTHONPATH="/opt/bidvolt"
autorestart=true
priority=5
stopasgroup=true

[program:worker]
command=/opt/bidvolt/.venv/bin/python -m app.services.worker
directory=/opt/bidvolt
environment=PYTHONPATH="/opt/bidvolt"
autorestart=true
priority=5
stopasgroup=true

# Hermes：安装后按实际入口启用
# [program:hermes]
# command=/opt/bidvolt/.venv/bin/hermes serve --config /etc/bidvolt/hermes.yaml
# directory=/opt/bidvolt
# environment=PYTHONPATH="/opt/bidvolt"
# autorestart=true
# priority=5
# stopasgroup=true

[program:backup-cron]
command=/usr/sbin/cron -f
autorestart=true
priority=10
stopasgroup=true
