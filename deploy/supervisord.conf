[supervisord]
nodaemon=true
logfile=/var/log/bidvolt/supervisord.log
loglevel=info
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/bidvolt/pgdata -c config_file=/etc/bidvolt/postgresql.conf
user=postgres
autorestart=true
priority=1
stopasgroup=true
stopsignal=INT

[program:clamd]
command=/usr/sbin/clamd --config-file=/etc/clamav/clamd.conf
user=clamav
autorestart=true
priority=3
stopasgroup=true

[program:app]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/opt/bidvolt
environment=PYTHONPATH="/opt/bidvolt"
autorestart=true
priority=5
stopasgroup=true

[program:worker]
command=/opt/venv/bin/python -m app.services.worker
directory=/opt/bidvolt
environment=PYTHONPATH="/opt/bidvolt"
autorestart=true
priority=5
stopasgroup=true

# Hermes 启动命令以实际安装为准（hermes serve / 入口模块），容器就绪后核对
[program:hermes]
command=/opt/venv/bin/hermes serve --config /etc/bidvolt/hermes.yaml
directory=/opt/bidvolt
environment=PYTHONPATH="/opt/bidvolt"
autorestart=true
priority=5
stopasgroup=true

[program:backup-cron]
command=/usr/sbin/cron -f
autorestart=true
priority=10
stopasgroup=true
