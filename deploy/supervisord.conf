[supervisord]
nodaemon=true
logfile=/var/log/bidvolt/supervisord.log
loglevel=info
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/local/bin/bidvolt-postgres
user=postgres
autorestart=true
priority=1
stopasgroup=true
stopsignal=INT

[program:clamd]
command=/usr/sbin/clamd --config-file=/etc/clamav/clamd.conf
user=clamav
autorestart=true
priority=3
stopasgroup=true

[program:app]
command=__REPO__/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8123 --workers 1
directory=__REPO__
environment=PYTHONPATH="__REPO__"
autorestart=true
priority=5
stopasgroup=true

[program:worker]
command=__REPO__/.venv/bin/python -m app.services.worker
directory=__REPO__
environment=PYTHONPATH="__REPO__"
autorestart=true
priority=5
stopasgroup=true

[program:hermes]
command=__HERMES_HOME__/venv/bin/hermes serve --skip-build --host 127.0.0.1 --port 9119
directory=__HERMES_HOME__
environment=HERMES_HOME="__HERMES_HOME__",PYTHONUNBUFFERED="1",PATH="__HERMES_HOME__/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
priority=6
stopasgroup=true

[program:backup-cron]
command=/usr/sbin/cron -f
autorestart=true
priority=10
stopasgroup=true
