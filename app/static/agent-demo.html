body{font-family:"Microsoft YaHei",sans-serif;margin:24px;background:#f6f8fb;color:#1f2d3d}

<body>
<h1>BidVolt · Agent 主会话演示 <span class="badge">新方案</span> <span class="badge">旧 /demo 不受影响</span></h1>
<div id="banner" style="display:none;padding:12px 14px;margin:10px 0;border-radius:8px;font-size:14px;font-weight:bold;white-space:pre-wrap"></div>
<div id="err" title="点击关闭" style="display:none;padding:12px 14px;margin:10px 0;border-radius:8px;font-size:14px;font-weight:bold;background:#fdeaea;color:#a02727;border:2px solid #d64545;white-space:pre-wrap;cursor:pointer" onclick="this.style.display='none'"></div>
<div id="session-bar" style="font:12px/1.7 Microsoft YaHei,sans-serif;color:#2f6db3;background:#eef4fb;border:1px solid #2f6db3;border-radius:6px;padding:4px 10px;margin:4px 0;display:none"></div>
<div id="imgdesc-status" style="font:12px/1.7 Microsoft YaHei,sans-serif;color:#3f5f85;margin:2px 0;display:none"></div>
<div>
  <input id="a-email" placeholder="邮箱（自动生成）">
  <input id="a-pwd" placeholder="密码" value="Abc12345">
  <input id="a-name" placeholder="企业名称" value="Agent演示企业">

  <button onclick="login()">登录</button>
</div>
<div>
  <input id="p-name" placeholder="项目名称" value="Agent演示项目">
  <button onclick="createProject()">创建项目</button>
</div>
<div>

  <button onclick="upload()">上传采购文件</button>
</div>
<div>
  <input type="file" id="e-file" multiple>
  <button onclick="uploadEnterprise()">上传企业资料（资质/业绩/人员/财务 → 企业资料库）</button>
</div>
<div>
  <button onclick="refreshMaterials()">刷新项目资料列表</button>
  <div id="mat-list" style="background:#fff;border:1px solid #d9e2ec;border-radius:8px;padding:10px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;max-height:320px;overflow:auto;display:none"></div>
</div>
<div>
  <button onclick="agentRun()" title="发起端到端投标任务：解析→提问→撰写→校验→评审→成文→打包，全程自动">▶ 开始</button>
  <button onclick="agentRunResume()" title="沿用上一次任务的会话继续跑（运行中则恢复监控）">↻ 续跑上次主会话</button>
  <button onclick="refreshTask()">刷新任务状态</button>
  <button onclick="openConsole()">打开会话控制台</button>
  <button onclick="downloadPackage()">下载响应文件包</button>
</div>
<hr>
<h2>历史中标价行情库（公共共建库 + 本企业私有库，联合查询 / xlsx 共建导入）</h2>
<div>
  <input id="hl-cat" placeholder="品类关键词（如：调控云）" style="width:220px">
  <input id="hl-pub" placeholder="发布单位关键词" style="width:220px">
  <select id="hl-scope" style="padding:6px;margin:4px">
    <option value="all">全部（公共+私有）</option>
    <option value="public">仅公共库</option>
    <option value="private">仅私有库</option>
  </select>
  <select id="hl-mode" style="padding:6px;margin:4px">
    <option value="">报价方式（不限）</option>
    <option value="折扣率">折扣率</option>
    <option value="固定总价">固定总价</option>
    <option value="比例报价">比例报价</option>
    <option value="系数报价">系数报价</option>
  </select>
  <button onclick="historyQuery()">查询行情库</button>
</div>
<div>
  <input type="file" id="hl-file" accept=".xlsx">
  <select id="hl-target" style="padding:6px;margin:4px">
    <option value="public">导入到公共库（全平台共建可见）</option>
    <option value="private">导入到本企业私有库</option>
  </select>
  <button onclick="historyImport()">导入 xlsx（限价↔中标价明细）</button>
</div>
<div id="hl-out" style="background:#fff;border:1px solid #d9e2ec;border-radius:8px;padding:10px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;max-height:420px;overflow:auto;display:none"></div>

<hr>
<h2>会话控制台（服务 ↔ Hermes 主会话 全量消息；可直接对话）</h2>
<div>
  <input id="c-msg" placeholder="给主会话发消息（任务前先交代·开跑自动带上；运行中排队注入；完成后直接对话）" style="width:560px">
  <select id="c-mode" style="padding:6px;margin:4px" title="排队=主会话忙完这一步再处理；插话=不打断，下一步工具调用后注入改方向">
    <option value="queue">排队回复</option>
    <option value="steer">插话（边干边改）</option>
  </select>
  <button onclick="chatSend()">发送</button>
  <label style="margin-left:14px;user-select:none">
    <input type="checkbox" id="c-condensed" checked onchange="renderConsole()"> 精简视图
    <span title="过滤状态噪音（进度条/中断提示/思考动画/画框线），与交付包内『主会话记录-精简版.md』同一套规则">ⓘ</span>
  </label>
  <button onclick="consoleClose()">关闭控制台</button>
</div>
<div id="console" style="display:none;background:#10202f;color:#cfe6f8;padding:12px;border-radius:8px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;min-height:260px;max-height:520px;overflow:auto"></div>
<div id="ask-panel" style="display:none;background:#fffbe8;border:2px solid #d98a00;border-radius:8px;padding:12px;margin:10px 0;font:13px/1.8 Microsoft YaHei,sans-serif">
  <div style="font-weight:bold;color:#8a5a00">📩 主会话向你提问（它已自查企业资料库/采购文件/公开渠道，仅剩需要你确认的信息，每组回答独立提交，回答后自动回传）：</div>
  <ol id="ask-list" style="margin:6px 0;padding-left:6px"></ol>
</div>
<hr>
<div id="log">就绪。此页面只调用新接口 /agent-run（task_type=agent_pipeline），与旧流程接口隔离。</div>
<script>
let token = localStorage.getItem("bidvolt_agent_token") || "";
let projectId = localStorage.getItem("bidvolt_agent_pid") || "";
let taskId = localStorage.getItem("bidvolt_agent_task") || "";
let consoleSeq = 0;
let consoleAbort = null;
let bannerState = "idle"; // running | final
let lastTaskId = localStorage.getItem("bidvolt_agent_last_task") || "";
const BASE = location.origin;

function log(s){document.getElementById("log").innerText += "\n" + s;}

/* 显眼错误横幅：任何接口失败/上传失败都在页面顶部红条显示（用户一眼知道是文件/请求的问题，不是服务挂了）。
   不自动消失（用户需要时间看原因），点击横幅关闭；底部日志同步保留一份。 */
function showError(msg){
  const text = msg || "操作失败";
  const el = document.getElementById("err");
  el.innerText = "❌ " + text;
  el.style.display = "block";
  el.scrollIntoView({behavior:"smooth", block:"center"});
  log("❌ 错误：" + text); // 底部日志同步记录
}
window.addEventListener("unhandledrejection", (e) => {
  const reason = e.reason;
  showError((reason && reason.message) || String(reason));
});

/* 结果横幅：任务终态时置顶展示，一眼可见 闭环/未闭环/失败 */
function showBanner(kind, text){
  const el = document.getElementById("banner");
  el.style.display = "block";
  if(kind === "complete"){
    el.style.background = "#e8f7ec"; el.style.color = "#1e6b34"; el.style.border = "2px solid #2f9e54";
  } else if(kind === "incomplete"){
    el.style.background = "#fdf3e0"; el.style.color = "#8a5a00"; el.style.border = "2px solid #d98a00";
  } else if(kind === "failed"){
    el.style.background = "#fdeaea"; el.style.color = "#a02727"; el.style.border = "2px solid #d64545";
  } else {
    el.style.background = "#eef2f7"; el.style.color = "#3f5f85"; el.style.border = "2px solid #7a93b5";
  }
  el.innerText = text;
  el.scrollIntoView();
}

/* 运行中横幅实时动态条：从事件流抽取主会话里程碑（不冒充精确百分比） */
const MILESTONE = /plan\s+\d+\s+task|delegate_task|🔀|Background task|ASYNC DELEGATION|验收|评审|通过|PIPELINE|save_deliverable|create_deliverable|upsert_requirements|未闭环|待补充/;
const SKIP_LINE = /^⚕|msg=interrupt|^\s*[0-9]+\s*$/;

function tickerUpdate(kind, content){
  if(bannerState !== "running") return;
  if(kind !== "hermes") return;
  const c = (content || "").trim();
  if(!c || SKIP_LINE.test(c) || !MILESTONE.test(c)) return;
  const line = c.length > 130 ? c.slice(0, 130) + "…" : c;
  const el = document.getElementById("banner");
  el.style.background = "#eef2f7"; el.style.color = "#3f5f85"; el.style.border = "2px solid #7a93b5";
  el.innerText = "⏳ 主会话运行中 · 最新动态：" + line;
}

function bannerFromEnd(d){
  bannerState = "final";
  let actions = "";
  if(d.action_list && d.action_list.length){
    actions = "\n\n📋 提交前客户动作清单：\n" + d.action_list.map(x=>"• " + x).join("\n");
  }
  if(d.error){
    const msg = (d.error && d.error.message) ? d.error.message : JSON.stringify(d.error);
    showBanner("failed", "❌ 任务执行失败：" + msg);
  } else if(d.outcome === "complete"){
    showBanner("complete", "✅ 主会话完成：全部验收门通过，交付件已落库。会话记录随响应文件包交付。" + actions);
  } else if(d.outcome === "incomplete"){
    showBanner("incomplete", "⚠ 主会话如实判定【未闭环】：\n" + (d.reason || "详见会话记录") + "\n补齐硬约束后可重新发起 agent-run。" + actions);
  } else if(d.status === 3){
    showBanner("complete", "✅ 任务结束（status=3）。" + actions);
  } else {
    showBanner("info", "任务终态：status=" + d.status + actions);
  }
}

const KIND_LABEL = {
  service: "🔵 服务 → 主会话",
  hermes:  "🟢 主会话",
  tool:    "🔧 工具/委派",
  error:   "🔴 错误",
  user:    "👤 客户 → 主会话",
};

let consoleEvents = [];

/* 精简视图噪音行判定（与后端 session_record 精简版同一套规则 + 状态条碎片补充） */
const NOISE_LINE = [
  /^⚕/, /^❯/, /^\(°ロ°\)/, /^\(⌐■_■\)/, /^\(¬_¬\)/, /^╭─/, /^╰─/, /^┌─/, /^└/, /^[│╭╰╞┌└─═]+$/,
  /^\([^()\n]{1,12}\)\s/, /^ヽ/, /^🗜️/, /^↩/, /^\d{1,4}s?\s*│/, /^\d{1,6}$/, /^⚠/, /^Requesting summary/, /^Iteration budget/,
];
const BOX_CHARS = "█░╭╮╰╯│┤┐┌└┘─═╞╡┴┬├";
function isNoiseLine(s){
  s = (s || "").trim();
  if(!s) return false;
  for(const re of NOISE_LINE){ if(re.test(s)) return true; }
  if(/^┊ (⚡|🔀|💻) preparing/.test(s) || /^(⚡ mcp__|💻|🔀)/.test(s)) return false;
  const body = s.split("").filter(ch => ch !== " ");
  if(body.length){
    let n = 0;
    for(const ch of body){ if(BOX_CHARS.includes(ch)) n++; }
    if(n / body.length > 0.55) return true;
  }
  return false;
}
function eventVisible(content){
  if(!document.getElementById("c-condensed").checked) return true;
  const lines = String(content || "").split("\n").filter(l => l.trim());
  if(!lines.length) return true;
  return !lines.every(isNoiseLine);
}

function renderConsole(){
  const el = document.getElementById("console");
  const condensed = document.getElementById("c-condensed").checked;
  const MAX_EVENTS = 2000; // 只渲染最近 N 条，防止长任务事件洪峰撑爆页面（完整记录随交付包会话记录）
  let events = consoleEvents;
  let folded = 0;
  if(events.length > MAX_EVENTS){
    folded = events.length - MAX_EVENTS;
    events = events.slice(-MAX_EVENTS);
  }
  let out = "";
  let hidden = 0;
  for(const e of events){
    if(condensed && !eventVisible(e.content)){ hidden++; continue; }
    let head = KIND_LABEL[e.kind] || e.kind;
    if(e.kind === "service" && /催办|系统提示|判定|未闭环|续跑/.test(e.content || "")){
      head = "🔔 " + head;
    }
    out += `\n\n=== ${head} [seq ${e.seq}] ===\n${e.content}`;
  }
  if(condensed && hidden) out += `\n\n……（精简视图已过滤 ${hidden} 条噪音事件；取消勾选查看全量原始记录）`;
  if(folded) out += `\n\n……（控制台仅渲染最近 ${MAX_EVENTS} 条，更早 ${folded} 条已折叠——完整记录见交付包内会话记录）`;
  el.innerText = out;
  el.scrollTop = el.scrollHeight;
}

function consoleAppend(seq, kind, content){
  consoleEvents.push({seq, kind, content});
  consoleSeq = Math.max(consoleSeq, seq || 0);
  renderConsole();
}

/* 客户问卡：主数据来自 /questions 端点（ask_customer 工具落库），旧【ASK】文本块仅作兜底。
   多组提问全部展示：每组独立倒计时 + 独立作答（不再只显示最新一组） */
let lastAskKey = "";
let askWindowTimer = null;
let askWindowBlocks = [];
let pollTimer = null;
async function pollQuestions(){
  if(!taskId) return;
  try{
    const state = await api("GET", `/api/v1/projects/${projectId}/agent-run/${taskId}/questions`);
    renderAskFromState(state);
  }catch(e){ /* 端点不可用时静默（旧块兜底仍走流解析） */ }
}
function fmtWindow(created_at, window_minutes){
  const deadline = new Date(created_at).getTime() + window_minutes * 60000;
  const remain = deadline - Date.now();
  if(remain > 0){
    const m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
    return "⏳ 问答窗口：" + m + " 分 " + s + " 秒（超时后主会话将自行决定走向，你仍可补答）";
  }
  return "⏳ 已超时：主会话已收到「自行决定」提示，不再等待（你仍可补答，补答会回传重验）";
}
function refreshAskWindows(){
  for(const b of askWindowBlocks){ b.el.innerText = fmtWindow(b.created_at, b.window_minutes); }
}
function askItemText(it){
  if(typeof it === "string") return it;
  const t = it.q || "";
  if(it.need || it.checked){
    return t + "\n（为什么需要：" + (it.need || "未说明") + "；已自查：" + (it.checked || "未说明") + "）";
  }
  return t;
}
function renderAskFromState(state){
  const asks = (state && state.asks) || [];
  const unanswered = asks.filter(a => a.kind === "question" && !a.answered && !a.legacy);
  const legacy = asks.filter(a => a.legacy && !a.answered);
  const targets = unanswered.length ? unanswered : legacy;
  if(!targets.length) return;
  const key = targets.map(a => (a.ask_id || "legacy") + ":" + (a.items || []).length).join("|");
  if(key === lastAskKey){ refreshAskWindows(); return; }
  lastAskKey = key;
  const panel = document.getElementById("ask-panel");
  const list = document.getElementById("ask-list");
  list.innerHTML = "";
  askWindowBlocks = [];
  targets.forEach((t, bi) => {
    const block = document.createElement("li");
    block.style.cssText = "margin-bottom:12px;list-style:none";
    const head = document.createElement("div");
    head.style.fontWeight = "bold";
    head.textContent = t.ask_id
      ? ("📩 提问 ask#" + t.ask_id + (targets.length > 1 ? "（第 " + (bi + 1) + "/" + targets.length + " 组）" : ""))
      : "📩 主会话提问（历史会话）";
    block.appendChild(head);
    if(t.created_at && t.window_minutes){
      const win = document.createElement("div");
      win.style.cssText = "color:#8a5a00;font-size:12px";
      win.innerText = fmtWindow(t.created_at, t.window_minutes);
      block.appendChild(win);
      askWindowBlocks.push({el: win, created_at: t.created_at, window_minutes: t.window_minutes});
    }
    const ol = document.createElement("ol");
    ol.style.cssText = "margin:4px 0;padding-left:18px";
    (t.items || []).forEach(it => {
      const li = document.createElement("li");
      li.textContent = askItemText(it);
      ol.appendChild(li);
    });
    block.appendChild(ol);
    if(t.ask_id){
      const ta = document.createElement("textarea");
      ta.id = "ask-ta-" + t.ask_id;
      ta.rows = 3;
      ta.style.cssText = "width:100%;box-sizing:border-box;padding:6px";
      ta.placeholder = "逐条回答（如：1. 被授权人：张三；2. 开户行：xx银行xx支行；3. 不需要的写『无』）";
      block.appendChild(ta);
      const btn = document.createElement("button");
      btn.textContent = "提交本组回答（回传给主会话）";
      btn.onclick = function(){ sendAskAnswerFor(t.ask_id, ta.id); };
      block.appendChild(btn);
    } else {
      const note = document.createElement("div");
      note.style.cssText = "font-size:12px;color:#666";
      note.textContent = "（历史会话提问：请在下方聊天输入框输入回答后点发送）";
      block.appendChild(note);
    }
    list.appendChild(block);
  });
  panel.style.display = "block";
  panel.scrollIntoView({behavior:"smooth", block:"center"});
  if(askWindowTimer) clearInterval(askWindowTimer);
  askWindowTimer = setInterval(refreshAskWindows, 30000);
}
async function sendAskAnswerFor(askId, taId){
  const ta = document.getElementById(taId);
  const msg = ta.value.trim();
  if(!msg){log("先填写回答");return;}
  if(!taskId){log("还没有任务");return;}
  try{
    const d = await api("POST", `/api/v1/projects/${projectId}/agent-run/${taskId}/asks/${askId}/answer`, {answer: msg});
    consoleAppend(++consoleSeq, "user", "对提问 ask#" + askId + " 的回答：" + msg);
    log(d.queued ? "回答已送达主会话：它手头这步忙完就会读取并回填（几分钟内）" : "主会话已回复（见控制台）");
    ta.value = "";
    lastAskKey = "";
    pollQuestions();
  }catch(e){
    consoleAppend(++consoleSeq, "error", String(e.message || e));
  }
}

/* 旧【ASK】文本块兜底解析（工具上线前会话） */
function extractAsk(content){
  const m = String(content || "").match(/【ASK】([\s\S]*?)【ASK_END】/);
  return m ? m[1].trim() : null;
}
function showAskPanel(seq, text){
  const lines = text.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return;
  const key = "legacy:" + seq;
  if(key === lastAskKey) return;
  lastAskKey = key;
  const panel = document.getElementById("ask-panel");
  const list = document.getElementById("ask-list");
  list.innerHTML = "";
  askWindowBlocks = [];
  const block = document.createElement("li");
  block.style.cssText = "margin-bottom:12px;list-style:none";
  const head = document.createElement("div");
  head.style.fontWeight = "bold";
  head.textContent = "📩 主会话提问（历史会话）";
  block.appendChild(head);
  const ol = document.createElement("ol");
  ol.style.cssText = "margin:4px 0;padding-left:18px";
  lines.forEach(l => {
    const li = document.createElement("li");
    li.textContent = l;
    ol.appendChild(li);
  });
  block.appendChild(ol);
  const note = document.createElement("div");
  note.style.cssText = "font-size:12px;color:#666";
  note.textContent = "（历史会话提问：请在下方聊天输入框输入回答后点发送）";
  block.appendChild(note);
  list.appendChild(block);
  panel.style.display = "block";
  panel.scrollIntoView({behavior:"smooth", block:"center"});
}

async function openConsole(){
  const el = document.getElementById("console");
  el.style.display = "block";
  consoleEvents = [];
  el.innerText = "";
  if(!taskId){ log("还没有任务，先点 Agent 主会话"); return; }
  if(consoleAbort) consoleAbort.abort();
  consoleAbort = new AbortController();
  log("控制台已打开：补发历史事件 + 实时推送…");
  pollQuestions();
  try{
    const resp = await fetch(`${BASE}/api/v1/projects/${projectId}/agent-run/${taskId}/stream?since=${consoleSeq}`, {
      headers: {"Authorization": "Bearer " + token}, signal: consoleAbort.signal,
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for(const part of parts){
        const m = part.match(/^event: (\w+)\ndata: (.+)$/);
        if(!m) continue;
        if(m[1] === "end"){
          const d = JSON.parse(m[2]);
          consoleAppend(0, "service", "会话结束。status=" + d.status + " session_id=" + (d.session_id || ""));
          bannerFromEnd(d);
          return;
        }
        if(m[1] === "message"){
          const d = JSON.parse(m[2]);
          consoleAppend(d.seq, d.kind, d.content);
          tickerUpdate(d.kind, d.content);
          if(d.kind === "hermes"){
            const ask = extractAsk(d.content);
            if(ask) showAskPanel(d.seq, ask);
          }
          // 提问/动作清单以 ask_customer 工具落库为准：任一事件后防抖拉取 /questions
          if(pollTimer) clearTimeout(pollTimer);
          pollTimer = setTimeout(pollQuestions, 800);
        }
      }
    }
  }catch(e){
    if(e.name !== "AbortError") log("控制台流错误: " + e);
  }
}

async function chatSend(){
  const msg = document.getElementById("c-msg").value.trim();
  if(!msg){log("先输入消息");return;}
  if(!taskId){
    // 任务前对话：项目级 pre-chat 会话（可问「现在都有哪些资料？」——只读工具可用；
    // agent-run 开跑时任务 prompt 会注入该会话，交代自动成为主会话上下文）
    if(!projectId){ showError("先创建项目（上方【项目名称】→【创建项目】）再对话。"); return; }
    try{
      const d = await api("POST", `/api/v1/projects/${projectId}/pre-chat`, {message: msg});
      consoleAppend(++consoleSeq, "user", msg);
      consoleAppend(++consoleSeq, "hermes", d.reply || "(空回复)");
      log("任务前对话已建立（session_id=" + d.session_id + "）——开跑时自动带上这段交代");
      document.getElementById("c-msg").value = "";
      return;
    }catch(e){
      consoleAppend(++consoleSeq, "error", String(e.message || e));
      return;
    }
  }
  consoleAppend(++consoleSeq, "user", msg);
  try{
    const mode = (document.getElementById("c-mode") || {}).value || "queue";
    const d = await api("POST", `/api/v1/projects/${projectId}/agent-run/${taskId}/chat`, {message: msg, mode: mode});
    if(d.queued){
      if(d.mode === "steer"){
        showBanner("info", "✋ 插话已注入：主会话在下一步工具调用后会看到你的消息并调整方向（不打断当前步骤）。");
      } else {
        showBanner("info", "⏳ 消息已送达主会话：它正在忙手头这一步，做完马上读你的消息并回复（通常几分钟内，不用等整份标书完成）。回复会出现在下方控制台。");
      }
      log("已送达主会话（" + (d.mode === "steer" ? "插话" : "排队") + "）：" + msg);
      document.getElementById("c-msg").value = "";
      return;
    }
    consoleAppend(++consoleSeq, "hermes", d.reply || "(空回复)");
    log("主会话已回复（session_id=" + d.session_id + "）");
    document.getElementById("c-msg").value = "";
  }catch(e){
    consoleAppend(++consoleSeq, "error", String(e.message || e));
  }
}

async function api(method, path, body){
  let resp = await fetch(BASE + path, {method, headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body: body?JSON.stringify(body):undefined});
  // 访问令牌过期（2h）：用 30 天有效的 refresh token 自动续期一次并重试
  const refresh = localStorage.getItem("bidvolt_agent_refresh");
  if(resp.status === 401 && refresh){
    try{
      const r = await fetch(BASE + "/api/v1/auth/refresh", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({refresh_token: refresh})});
      if(r.ok){
        const d = await r.json();
        token = d.access_token; localStorage.setItem("bidvolt_agent_token", token);
        localStorage.setItem("bidvolt_agent_refresh", d.refresh_token);
        log("登录令牌已自动续期");
        resp = await fetch(BASE + path, {method, headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body: body?JSON.stringify(body):undefined});
      }
    }catch(_e){ /* 续期失败走下方统一 401 处理 */ }
  }
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok){
    if(resp.status === 401){
      token = ""; localStorage.removeItem("bidvolt_agent_token"); localStorage.removeItem("bidvolt_agent_refresh");
      refreshSessionBar();
      showError(
        "⚠️ 登录已失效，当前操作被拒绝。\n\n" +
        "请重新登录（页面顶部第一行）：\n" +
        "① 在【邮箱】框输入你的账号邮箱；\n" +
        "② 在【密码】框输入密码；\n" +
        "③ 点【登录】按钮；\n" +
        "④ 登录成功后再重试刚才的操作。\n\n" +
        "（登录状态保持 30 天；超过 30 天未登录就需要重新登录一次。）"
      );
      throw new Error("登录已失效，请重新登录");
    }
    const msg = data.detail || (resp.status + " " + resp.statusText);
    showError(msg);
    throw new Error(msg);
  }
  return data;
}

async function upload(){
  if(!projectId){ showError("先创建项目（上方【项目名称】→【创建项目】）再上传采购文件。"); return; }
  const files = document.getElementById("f-file").files;
  if(!files.length){showError("先选择要上传的采购文件（可多选，支持压缩包自动解包）");return;}
  for(let i=0;i<files.length;i++){
    const fd = new FormData();
    fd.append("target","project"); fd.append("project_id", String(projectId)); fd.append("files", files[i]);
    try{
      const resp = await fetch(BASE + "/api/v1/files/upload", {method:"POST", headers:{"Authorization":"Bearer "+token}, body:fd});
      const d = await resp.json();
      if(!resp.ok){ showError((d.detail) || ("上传失败 " + resp.status)); continue; }
      const errs = (d.files||[]).filter(x => x.error);
      const dups = (d.files||[]).filter(x => x.duplicate);
      if(errs.length){ showError("上传部分失败：\n" + errs.map(x => x.name + " → " + x.error).join("\n")); }
      if(dups.length){ log("重复文件已跳过：" + dups.map(x => x.name).join("、")); }
      for(const x of (d.files||[])){
        if(x.expanded){
          if(x.expanded.error){ showError("压缩包 " + x.name + " 解包失败：" + x.expanded.error); }
          else log("压缩包 " + x.name + " 已自动解包入库：新增 " + x.expanded.imported + " 个文件（重复跳过 " + x.expanded.duplicates + "，失败 " + x.expanded.failed + "）");
        }
      }
      log("上传: " + JSON.stringify(d).slice(0,200));
    }catch(e){ showError(e.message); }
  }
  refreshMaterials();
}

  for(const m of rows){

    if(m.source_archive_name){
      line = "　↳ " + (m.file_name || "?") + (m.block_count ? "（" + m.block_count + " 块）" : "")
           + "　← 来自《" + m.source_archive_name + "》" + (m.archive_path ? "　路径：" + m.archive_path : "");

      line = "• " + (m.file_name || "?") + (m.block_count ? "（" + m.block_count + " 块）" : "");
      if((m.ext || "") === ".zip"){
        line += m.expanded_count ? ("　📦 已解包（" + m.expanded_count + " 个文件）") : "　📦 未解包";

      btn.onclick = function(){ expandZip(m.file_id, m.file_name); };

async function agentRunResume(){
  if(!projectId){ showError("先创建项目（上方【项目名称】→【创建项目】）再续跑。"); return; }
  if(!lastTaskId){ log("没有可续跑的任务（先点【开始】跑一单）"); return; }
  // 上一任务仍在运行：不新建续跑任务，直接恢复监控（刷新后点续跑的正确行为）
  try{
    const prev = await api("GET", `/api/v1/projects/${projectId}/agent-run/${lastTaskId}`);

      taskId = String(lastTaskId);

      openConsole();
      poll();

  }catch(e){ /* 状态查询失败则走新建续跑 */ }
  const d = await api("POST", `/api/v1/projects/${projectId}/agent-run`, {idempotency_key: "agent-" + Date.now(), payload:{}, resume_from_task_id: Number(lastTaskId)});
  log("已发起续跑：沿用上一单会话（resume_session_id=" + (d.resume_session_id || "") + "）");
  startRun(d);
}

  }
  out.innerText = txt;
}
async function historyImport(){
  const f = document.getElementById("hl-file").files[0];
  if(!f){showError("先选 xlsx 文件");return;}
  const fd = new FormData();
  fd.append("target", document.getElementById("hl-target").value);
  fd.append("file", f);
  try{
    const resp = await fetch(BASE + "/api/v1/quotes/history/import", {method:"POST", headers:{"Authorization":"Bearer "+token}, body:fd});
    const d = await resp.json();
    if(resp.ok){
      log(`行情导入完成：入库 ${d.imported} 条（解析 ${d.parsed_total}，跳过 ${d.skipped_rows}），范围 ${d.scope}`);
      historyQuery();
    } else {
      const msg = (d.detail) || ("导入失败 " + resp.status);
      showError("行情导入失败：" + msg);
      log("导入失败: " + resp.status + " " + JSON.stringify(d).slice(0,300));
    }
  }catch(e){ showError("行情导入失败：" + e.message); }
}
</script>
