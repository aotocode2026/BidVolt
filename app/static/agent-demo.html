<body>

<div>
  <input id="hl-cat" placeholder="品类关键词（如：调控云）" style="width:220px">

  <select id="hl-scope" style="padding:6px;margin:4px">

  </select>
  <button onclick="historyImport()">导入 xlsx（限价↔中标价明细）</button>
</div>
<div id="hl-out" style="background:#fff;border:1px solid #d9e2ec;border-radius:8px;padding:10px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;max-height:420px;overflow:auto;display:none"></div>

<hr>
<h2>会话控制台（服务 ↔ Hermes 主会话 全量消息；可直接对话）</h2>
<div>
  <input id="c-msg" placeholder="给主会话发消息（任务前先交代·开跑自动带上；运行中排队注入；完成后直接对话）" style="width:560px">
  <button onclick="chatSend()">发送</button>
  <label style="margin-left:14px;user-select:none">
    <input type="checkbox" id="c-condensed" checked onchange="renderConsole()"> 精简视图
    <span title="过滤状态噪音（进度条/中断提示/思考动画/画框线），与交付包内『主会话记录-精简版.md』同一套规则">ⓘ</span>
  </label>
  <button onclick="consoleClose()">关闭控制台</button>
</div>
<div id="console" style="display:none;background:#10202f;color:#cfe6f8;padding:12px;border-radius:8px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;min-height:260px;max-height:520px;overflow:auto"></div>
<div id="ask-panel" style="display:none;background:#fffbe8;border:2px solid #d98a00;border-radius:8px;padding:12px;margin:10px 0;font:13px/1.8 Microsoft YaHei,sans-serif">
  <div style="font-weight:bold;color:#8a5a00">📩 主会话向你提问（它已自查企业资料库/采购文件/公开渠道，仅剩需要你确认的信息，回答后自动回传）：</div>
  <ol id="ask-list" style="margin:6px 0;padding-left:22px"></ol>
  <textarea id="ask-answer" rows="3" style="width:100%;box-sizing:border-box;padding:6px" placeholder="逐条回答（如：1. 被授权人：张三；2. 开户行：xx银行xx支行；3. 不需要的写『无』）"></textarea>
  <button onclick="sendAskAnswer()">提交回答（回传给主会话）</button>
</div>
<hr>
<div id="log">就绪。此页面只调用新接口 /agent-run（task_type=agent_pipeline），与旧流程接口隔离。</div>
<script>
let token = localStorage.getItem("bidvolt_agent_token") || "";
let projectId = localStorage.getItem("bidvolt_agent_pid") || "";
let taskId = localStorage.getItem("bidvolt_agent_task") || "";
let consoleSeq = 0;
let consoleAbort = null;
let bannerState = "idle"; // running | final
let lastTaskId = localStorage.getItem("bidvolt_agent_last_task") || "";
const BASE = location.origin;

function log(s){document.getElementById("log").innerText += "\n" + s;}

/* 显眼错误横幅：任何接口失败/上传失败都在页面顶部红条显示（用户一眼知道是文件/请求的问题，不是服务挂了） */
let errTimer = null;
function showError(msg){
  const el = document.getElementById("err");
  el.innerText = "❌ " + (msg || "操作失败");
  el.style.display = "block";
  el.scrollIntoView({behavior:"smooth", block:"center"});
  if(errTimer) clearTimeout(errTimer);
  errTimer = setTimeout(() => { el.style.display = "none"; }, 15000);
}
window.addEventListener("unhandledrejection", (e) => {
  const reason = e.reason;
  showError((reason && reason.message) || String(reason));
});

/* 结果横幅：任务终态时置顶展示，一眼可见 闭环/未闭环/失败 */
function showBanner(kind, text){
  const el = document.getElementById("banner");
  el.style.display = "block";
  if(kind === "complete"){
    el.style.background = "#e8f7ec"; el.style.color = "#1e6b34"; el.style.border = "2px solid #2f9e54";
  } else if(kind === "incomplete"){
    el.style.background = "#fdf3e0"; el.style.color = "#8a5a00"; el.style.border = "2px solid #d98a00";
  } else if(kind === "failed"){
    el.style.background = "#fdeaea"; el.style.color = "#a02727"; el.style.border = "2px solid #d64545";
  } else {
    el.style.background = "#eef2f7"; el.style.color = "#3f5f85"; el.style.border = "2px solid #7a93b5";
  }
  el.innerText = text;
  el.scrollIntoView();
}

/* 运行中横幅实时动态条：从事件流抽取主会话里程碑（不冒充精确百分比） */
const MILESTONE = /plan\s+\d+\s+task|delegate_task|🔀|Background task|ASYNC DELEGATION|验收|评审|通过|PIPELINE|save_deliverable|create_deliverable|upsert_requirements|未闭环|待补充/;
const SKIP_LINE = /^⚕|msg=interrupt|^\s*[0-9]+\s*$/;

function tickerUpdate(kind, content){
  if(bannerState !== "running") return;
  if(kind !== "hermes") return;
  const c = (content || "").trim();
  if(!c || SKIP_LINE.test(c) || !MILESTONE.test(c)) return;
  const line = c.length > 130 ? c.slice(0, 130) + "…" : c;
  const el = document.getElementById("banner");
  el.style.background = "#eef2f7"; el.style.color = "#3f5f85"; el.style.border = "2px solid #7a93b5";
  el.innerText = "⏳ 主会话运行中 · 最新动态：" + line;
}

function bannerFromEnd(d){
  bannerState = "final";
  let actions = "";
  if(d.action_list && d.action_list.length){
    actions = "\n\n📋 提交前客户动作清单：\n" + d.action_list.map(x=>"• " + x).join("\n");
  }
  if(d.error){
    const msg = (d.error && d.error.message) ? d.error.message : JSON.stringify(d.error);
    showBanner("failed", "❌ 任务执行失败：" + msg);
  } else if(d.outcome === "complete"){
    showBanner("complete", "✅ 主会话完成：全部验收门通过，交付件已落库。会话记录随响应文件包交付。" + actions);
  } else if(d.outcome === "incomplete"){
    showBanner("incomplete", "⚠ 主会话如实判定【未闭环】：\n" + (d.reason || "详见会话记录") + "\n补齐硬约束后可重新发起 agent-run。" + actions);
  } else if(d.status === 3){
    showBanner("complete", "✅ 任务结束（status=3）。" + actions);
  } else {
    showBanner("info", "任务终态：status=" + d.status + actions);
  }
}

const KIND_LABEL = {
  service: "🔵 服务 → 主会话",
  hermes:  "🟢 主会话",
  tool:    "🔧 工具/委派",
  error:   "🔴 错误",
  user:    "👤 客户 → 主会话",
};

let consoleEvents = [];

/* 精简视图噪音行判定（与后端 session_record 精简版同一套规则 + 状态条碎片补充） */
const NOISE_LINE = [
  /^⚕/, /^❯/, /^\(°ロ°\)/, /^\(⌐■_■\)/, /^\(¬_¬\)/, /^╭─/, /^╰─/, /^┌─/, /^└/, /^[│╭╰╞┌└─═]+$/,
  /^\([^()\n]{1,12}\)\s/, /^ヽ/, /^🗜️/, /^↩/, /^\d{1,4}s?\s*│/, /^\d{1,6}$/, /^⚠/, /^Requesting summary/, /^Iteration budget/,
];
const BOX_CHARS = "█░╭╮╰╯│┤┐┌└┘─═╞╡┴┬├";
function isNoiseLine(s){
  s = (s || "").trim();
  if(!s) return false;
  for(const re of NOISE_LINE){ if(re.test(s)) return true; }
  if(/^┊ (⚡|🔀|💻) preparing/.test(s) || /^(⚡ mcp__|💻|🔀)/.test(s)) return false;
  const body = s.split("").filter(ch => ch !== " ");
  if(body.length){
    let n = 0;
    for(const ch of body){ if(BOX_CHARS.includes(ch)) n++; }
    if(n / body.length > 0.55) return true;
  }
  return false;
}
function eventVisible(content){
  if(!document.getElementById("c-condensed").checked) return true;
  const lines = String(content || "").split("\n").filter(l => l.trim());
  if(!lines.length) return true;
  return !lines.every(isNoiseLine);
}

function renderConsole(){
  const el = document.getElementById("console");
  const condensed = document.getElementById("c-condensed").checked;
  const MAX_EVENTS = 2000; // 只渲染最近 N 条，防止长任务事件洪峰撑爆页面（完整记录随交付包会话记录）
  let events = consoleEvents;
  let folded = 0;
  if(events.length > MAX_EVENTS){
    folded = events.length - MAX_EVENTS;
    events = events.slice(-MAX_EVENTS);
  }
  let out = "";
  let hidden = 0;
  for(const e of events){
    if(condensed && !eventVisible(e.content)){ hidden++; continue; }
    let head = KIND_LABEL[e.kind] || e.kind;
    if(e.kind === "service" && /催办|系统提示|判定|未闭环|续跑/.test(e.content || "")){
      head = "🔔 " + head;
    }
    out += `\n\n=== ${head} [seq ${e.seq}] ===\n${e.content}`;
  }
  if(condensed && hidden) out += `\n\n……（精简视图已过滤 ${hidden} 条噪音事件；取消勾选查看全量原始记录）`;
  if(folded) out += `\n\n……（控制台仅渲染最近 ${MAX_EVENTS} 条，更早 ${folded} 条已折叠——完整记录见交付包内会话记录）`;
  el.innerText = out;
  el.scrollTop = el.scrollHeight;
}

function consoleAppend(seq, kind, content){
  consoleEvents.push({seq, kind, content});
  consoleSeq = Math.max(consoleSeq, seq || 0);
  renderConsole();
}

/* 客户问卡：主数据来自 /questions 端点（ask_customer 工具落库），旧【ASK】文本块仅作兜底 */
let currentAskId = null;
let lastAskKey = "";
function askItemText(it){
  if(typeof it === "string") return it;
  const t = it.q || "";
  if(it.need || it.checked){
    return t + "\n（为什么需要：" + (it.need || "未说明") + "；已自查：" + (it.checked || "未说明") + "）";
  }
  return t;
}
function renderAskFromState(state){
  const asks = (state && state.asks) || [];
  const unanswered = asks.filter(a => a.kind === "question" && !a.answered && !a.legacy);
  let target = null;
  if(unanswered.length){
    target = unanswered[unanswered.length - 1]; // 最新一批未答复提问
  } else {
    const legacy = asks.filter(a => a.legacy && !a.answered);
    if(legacy.length) target = legacy[legacy.length - 1];
  }
  if(!target) return;
  const key = (target.ask_id || "legacy") + ":" + JSON.stringify(target.items).length;
  if(key === lastAskKey) return;
  lastAskKey = key;
  currentAskId = target.ask_id || null;
  const panel = document.getElementById("ask-panel");
  const list = document.getElementById("ask-list");
  list.innerHTML = "";
  (target.items || []).forEach(it => {
    const li = document.createElement("li");
    li.textContent = askItemText(it);
    list.appendChild(li);
  });
  document.getElementById("ask-answer").value = "";
  panel.style.display = "block";
  panel.scrollIntoView({behavior:"smooth", block:"center"});
}
let pollTimer = null;
async function pollQuestions(){
  if(!taskId) return;
  try{
    const state = await api("GET", `/api/v1/projects/${projectId}/agent-run/${taskId}/questions`);
    renderAskFromState(state);
  }catch(e){ /* 端点不可用时静默（旧块兜底仍走流解析） */ }
}
async function sendAskAnswer(){
  const msg = document.getElementById("ask-answer").value.trim();
  if(!msg){log("先填写回答");return;}
  if(!taskId){log("还没有任务");return;}
  document.getElementById("ask-panel").style.display = "none";
  lastAskKey = "";
  try{
    if(currentAskId){
      const d = await api("POST", `/api/v1/projects/${projectId}/agent-run/${taskId}/asks/${currentAskId}/answer`, {answer: msg});
      consoleAppend(++consoleSeq, "user", "对提问 ask#" + currentAskId + " 的回答：" + msg);
      log(d.queued ? "回答已送达主会话（当前轮结束后处理）" : "主会话已回复（见控制台）");
    } else {
      document.getElementById("c-msg").value = msg;
      await chatSend();
    }
  }catch(e){
    consoleAppend(++consoleSeq, "error", String(e.message || e));
  }
}

/* 旧【ASK】文本块兜底解析（工具上线前会话） */
function extractAsk(content){
  const m = String(content || "").match(/【ASK】([\s\S]*?)【ASK_END】/);
  return m ? m[1].trim() : null;
}
function showAskPanel(seq, text){
  const lines = text.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return;
  const key = "legacy:" + seq;
  if(key === lastAskKey) return;
  lastAskKey = key;
  currentAskId = null;
  const panel = document.getElementById("ask-panel");
  const list = document.getElementById("ask-list");
  list.innerHTML = "";
  lines.forEach(l => {
    const li = document.createElement("li");
    li.textContent = l;
    list.appendChild(li);
  });
  document.getElementById("ask-answer").value = "";
  panel.style.display = "block";
  panel.scrollIntoView({behavior:"smooth", block:"center"});
}

async function openConsole(){
  const el = document.getElementById("console");
  el.style.display = "block";
  consoleEvents = [];
  el.innerText = "";
  if(!taskId){ log("还没有任务，先点 Agent 主会话"); return; }
  if(consoleAbort) consoleAbort.abort();
  consoleAbort = new AbortController();
  log("控制台已打开：补发历史事件 + 实时推送…");
  pollQuestions();
  try{
    const resp = await fetch(`${BASE}/api/v1/projects/${projectId}/agent-run/${taskId}/stream?since=${consoleSeq}`, {
      headers: {"Authorization": "Bearer " + token}, signal: consoleAbort.signal,
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for(const part of parts){
        const m = part.match(/^event: (\w+)\ndata: (.+)$/);
        if(!m) continue;
        if(m[1] === "end"){
          const d = JSON.parse(m[2]);
          consoleAppend(0, "service", "会话结束。status=" + d.status + " session_id=" + (d.session_id || ""));
          bannerFromEnd(d);
          return;
        }
        if(m[1] === "message"){
          const d = JSON.parse(m[2]);
          consoleAppend(d.seq, d.kind, d.content);
          tickerUpdate(d.kind, d.content);
          if(d.kind === "hermes"){
            const ask = extractAsk(d.content);
            if(ask) showAskPanel(d.seq, ask);
          }
          // 提问/动作清单以 ask_customer 工具落库为准：任一事件后防抖拉取 /questions
          if(pollTimer) clearTimeout(pollTimer);
          pollTimer = setTimeout(pollQuestions, 800);
        }
      }
    }
  }catch(e){
    if(e.name !== "AbortError") log("控制台流错误: " + e);
  }
}

function consoleClose(){
  if(consoleAbort) consoleAbort.abort();
  consoleAbort = null;
  document.getElementById("console").style.display = "none";
}

async function chatSend(){
  const msg = document.getElementById("c-msg").value.trim();
  if(!msg){log("先输入消息");return;}
  if(!taskId){
    // 任务前对话：项目级 pre-chat 会话（agent-run 开跑时任务 prompt 会注入该会话）
    if(!projectId){log("先创建项目");return;}
    try{
      const d = await api("POST", `/api/v1/projects/${projectId}/pre-chat`, {message: msg});
      consoleAppend(++consoleSeq, "user", msg);
      consoleAppend(++consoleSeq, "hermes", d.reply || "(空回复)");
      log("任务前对话已建立（session_id=" + d.session_id + "）——开跑时自动带上这段交代");
      document.getElementById("c-msg").value = "";
      return;
    }catch(e){
      consoleAppend(++consoleSeq, "error", String(e.message || e));
      return;
    }
  }
  consoleAppend(++consoleSeq, "user", msg);
  try{
    const d = await api("POST", `/api/v1/projects/${projectId}/agent-run/${taskId}/chat`, {message: msg});
    if(d.queued){
      log("已送达主会话队列（当前轮结束后处理，回复会出现在控制台）");
      document.getElementById("c-msg").value = "";
      return;
    }
    consoleAppend(++consoleSeq, "hermes", d.reply || "(空回复)");
    log("主会话已回复（session_id=" + d.session_id + "）");
    document.getElementById("c-msg").value = "";
  }catch(e){
    consoleAppend(++consoleSeq, "error", String(e.message || e));
  }
}

async function api(method, path, body){
  const resp = await fetch(BASE + path, {method, headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body: body?JSON.stringify(body):undefined});
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok){
    const msg = data.detail || (resp.status + " " + resp.statusText);
    showError(msg);
    throw new Error(msg);
  }
  return data;
}

async function register(){
  const email = "agent-" + Date.now() + "@test.com";
  document.getElementById("a-email").value = email;
  const d = await api("POST","/api/v1/auth/register",{email,password:document.getElementById("a-pwd").value,enterprise_name:document.getElementById("a-name").value});
  token = d.access_token; localStorage.setItem("bidvolt_agent_token", token);
  log("注册成功 " + email);
}
async function login(){
  const d = await api("POST","/api/v1/auth/login",{email:document.getElementById("a-email").value,password:document.getElementById("a-pwd").value});
  token = d.access_token; localStorage.setItem("bidvolt_agent_token", token);
  log("登录成功");
}
async function createProject(){
  const d = await api("POST","/api/v1/projects",{name:document.getElementById("p-name").value});
  projectId = d.project_id; localStorage.setItem("bidvolt_agent_pid", String(projectId));
  log("项目创建 #" + projectId);
}
async function upload(){
  const f = document.getElementById("f-file").files[0];
  if(!f){showError("先选择要上传的采购文件");return;}
  const fd = new FormData();
  fd.append("target","project"); fd.append("project_id", String(projectId)); fd.append("files", f);
  try{
    const resp = await fetch(BASE + "/api/v1/files/upload", {method:"POST", headers:{"Authorization":"Bearer "+token}, body:fd});
    const d = await resp.json();
    if(!resp.ok){ showError((d.detail) || ("上传失败 " + resp.status)); return; }
    const errs = (d.files||[]).filter(x => x.error);
    const dups = (d.files||[]).filter(x => x.duplicate);
    if(errs.length){ showError("上传部分失败：\n" + errs.map(x => x.name + " → " + x.error).join("\n")); }
    if(dups.length){ log("重复文件已跳过：" + dups.map(x => x.name).join("、")); }
    log("上传: " + JSON.stringify(d).slice(0,200));
  }catch(e){ showError(e.message); }
}
async function uploadEnterprise(){
  const files = document.getElementById("e-file").files;
  if(!files.length){showError("先选择要上传的企业资料文件");return;}
  const fd = new FormData();
  fd.append("target","enterprise"); fd.append("files", files[0]);
  for(let i=1;i<files.length;i++) fd.append("files", files[i]);
  log("企业资料上传中（自动入库+按文件名分类+抽取初始事实）…");
  try{
    const resp = await fetch(BASE + "/api/v1/files/upload", {method:"POST", headers:{"Authorization":"Bearer "+token}, body:fd});
    const d = await resp.json();
    if(!resp.ok){ showError((d.detail) || ("上传失败 " + resp.status)); return; }
    const errs = (d.files||[]).filter(x => x.error);
    const dups = (d.files||[]).filter(x => x.duplicate);
    if(errs.length){ showError("企业资料部分上传失败：\n" + errs.map(x => x.name + " → " + x.error).join("\n")); }
    if(dups.length){ log("重复资料已跳过（内容与库内相同）：" + dups.map(x => x.name).join("、")); }
    log("企业资料: " + JSON.stringify(d).slice(0,600));
  }catch(e){ showError(e.message); }
}
async function agentRun(){
  const d = await api("POST", `/api/v1/projects/${projectId}/agent-run`, {idempotency_key: "agent-" + Date.now(), payload:{}});
  startRun(d);
}
async function agentRunResume(){
  if(!lastTaskId){ log("没有可续跑的任务（先跑一单）"); return; }
  // 上一任务仍在运行：不新建续跑任务，直接恢复监控（刷新后点续跑的正确行为）
  try{
    const prev = await api("GET", `/api/v1/projects/${projectId}/agent-run/${lastTaskId}`);
    if([1,2].includes(prev.status)){
      taskId = String(lastTaskId);
      localStorage.setItem("bidvolt_agent_task", taskId);
      log("上一任务 #" + lastTaskId + " 仍在运行：已恢复监控（无需新建续跑）");
      bannerState = "running";
      showBanner("info", "⏳ 已恢复对运行中任务 #" + lastTaskId + " 的监控…");
      openConsole();
      poll();
      return;
    }
  }catch(e){ /* 状态查询失败则走新建续跑 */ }
  const d = await api("POST", `/api/v1/projects/${projectId}/agent-run`, {idempotency_key: "agent-" + Date.now(), payload:{}, resume_from_task_id: Number(lastTaskId)});
  log("已发起续跑：沿用上一单会话（resume_session_id=" + (d.resume_session_id || "") + "）");
  startRun(d);
}
/* 页面加载/刷新：恢复本地会话状态；若任务仍在运行则自动恢复监控 */
async function restoreMonitor(){
  if(!token){return;}
  if(projectId) log("已恢复项目 #" + projectId + (taskId ? "（任务 #" + taskId + "）" : ""));
  if(!taskId) return;
  try{
    const d = await api("GET", `/api/v1/projects/${projectId}/agent-run/${taskId}`);
    if([1,2].includes(d.status)){
      bannerState = "running";
      showBanner("info", "⏳ 检测到运行中的任务 #" + taskId + "，已自动恢复监控…");
      openConsole();
      poll();
    } else if([3,4,5,6].includes(d.status)){
      bannerFromEnd({status: d.status, error: d.error,
        outcome: d.result && d.result.outcome, reason: d.result && d.result.reason,
        session_id: d.result && d.result.session_id, action_list: d.result && d.result.action_list});
      log("任务 #" + taskId + " 已终态：可点『续跑上次主会话』继续，或点『下载响应文件包』取件。");
    }
  }catch(e){ log("恢复监控失败: " + e); }
}
window.addEventListener("load", restoreMonitor);
function startRun(d){
  taskId = d.task_id; localStorage.setItem("bidvolt_agent_task", String(taskId));
  lastTaskId = String(taskId); localStorage.setItem("bidvolt_agent_last_task", lastTaskId);
  log("Agent 主会话任务 #" + taskId + " 已提交（task_type=agent_pipeline）");
  bannerState = "running";
  showBanner("info", "⏳ 主会话启动中…");
  openConsole(); // 自动打开控制台：事件流实时展示 + 驱动运行横幅动态条
  poll();
}
async function poll(){
  while(taskId){
    await new Promise(r=>setTimeout(r,8000));
    const d = await api("GET", `/api/v1/projects/${projectId}/agent-run/${taskId}`);
    const prog = d.progress || {};
    log(`任务 #${taskId} status=${d.status} ${prog.current_work || ""}`);
    if(d.result && d.result.session_id) log("会话 session_id=" + d.result.session_id + "（可恢复）");
    if([3,4,5,6].includes(d.status)){
      bannerFromEnd({status: d.status, error: d.error, outcome: d.result && d.result.outcome, reason: d.result && d.result.reason, session_id: d.result && d.result.session_id});
      break;
    }
  }
}
async function refreshTask(){
  if(!taskId){log("还没有任务");return;}
  const d = await api("GET", `/api/v1/projects/${projectId}/agent-run/${taskId}`);
  log(JSON.stringify(d).slice(0,800));
  if([3,4,5,6].includes(d.status)){
    bannerFromEnd({status: d.status, error: d.error, outcome: d.result && d.result.outcome, reason: d.result && d.result.reason, session_id: d.result && d.result.session_id});
  }
}
async function downloadPackage(){
  if(!projectId){showError("先创建项目");return;}
  try{
    const resp = await fetch(BASE + `/api/v1/projects/${projectId}/response-package`, {headers:{"Authorization":"Bearer "+token}});
    if(!resp.ok){
      let msg = "下载失败 " + resp.status;
      try{ const d = await resp.json(); if(d.detail) msg = d.detail; }catch(_e){}
      showError(msg);
      return;
    }
    const blob = await resp.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "响应文件包.zip";
    a.click();
    log("响应文件包已下载 " + blob.size + " B");
  }catch(e){ showError("下载失败：" + e.message); }
}
async function historyQuery(){
  const p = new URLSearchParams();
  const cat = document.getElementById("hl-cat").value.trim();
  const pub = document.getElementById("hl-pub").value.trim();
  const mode = document.getElementById("hl-mode").value;
  if(cat) p.set("category", cat);
  if(pub) p.set("publisher", pub);
  if(mode) p.set("price_mode", mode);
  p.set("scope", document.getElementById("hl-scope").value);
  p.set("limit", "50");
  const d = await api("GET", "/api/v1/quotes/history?" + p.toString());
  const out = document.getElementById("hl-out");
  out.style.display = "block";
  let txt = `共 ${d.sample_count} 条样本\n`;
  for(const st of (d.stats||[])){
    txt += `  [${st.price_mode}] ${st.count} 条，中标价区间 ${(st.win_price_range||[]).join(" ~ ")}\n`;
  }
  for(const s of (d.samples||[])){
    txt += `\n${s.source === "public" ? "【公共】" : "【私有】"} ${s.notice_id || ""}\n  品类: ${s.category||"-"}  包名: ${s.package_name||"-"}\n  发布: ${s.publisher||"-"}  ${s.publish_date||""}  方式: ${s.price_mode}\n  限价: ${s.limit_price ?? "-"}  中标价: ${s.win_price}  比值: ${s.win_ratio ?? "-"}\n  中标证据: ${s.win_evidence_url || s.win_evidence || "-"}`;
  }
  out.innerText = txt;
}
async function historyImport(){
  const f = document.getElementById("hl-file").files[0];
  if(!f){showError("先选 xlsx 文件");return;}
  const fd = new FormData();
  fd.append("target", document.getElementById("hl-target").value);
  fd.append("file", f);
  try{
    const resp = await fetch(BASE + "/api/v1/quotes/history/import", {method:"POST", headers:{"Authorization":"Bearer "+token}, body:fd});
    const d = await resp.json();
    if(resp.ok){
      log(`行情导入完成：入库 ${d.imported} 条（解析 ${d.parsed_total}，跳过 ${d.skipped_rows}），范围 ${d.scope}`);
      historyQuery();
    } else {
      const msg = (d.detail) || ("导入失败 " + resp.status);
      showError("行情导入失败：" + msg);
      log("导入失败: " + resp.status + " " + JSON.stringify(d).slice(0,300));
    }
  }catch(e){ showError("行情导入失败：" + e.message); }
}
