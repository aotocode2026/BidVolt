<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BidVolt · Agent 主会话演示（新方案）</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;margin:24px;background:#f6f8fb;color:#1f2d3d}
h1{font-size:20px}
h2{font-size:15px;margin-top:18px}
button{padding:6px 14px;margin:4px;cursor:pointer}
input{padding:6px;margin:4px;width:280px}
#log{background:#10202f;color:#d7e6f5;padding:12px;border-radius:8px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;min-height:200px;max-height:420px;overflow:auto}
.badge{display:inline-block;background:#eef4fb;border:1px solid #2f6db3;color:#2f6db3;border-radius:4px;padding:2px 8px;font-size:12px;margin:4px}
</style>
</head>
<body>
<h1>BidVolt · Agent 主会话演示 <span class="badge">新方案</span> <span class="badge">旧 /demo 不受影响</span></h1>
<div id="banner" style="display:none;padding:12px 14px;margin:10px 0;border-radius:8px;font-size:14px;font-weight:bold;white-space:pre-wrap"></div>
<div>
  <input id="a-email" placeholder="邮箱（自动生成）">
  <input id="a-pwd" placeholder="密码" value="Abc12345">
  <input id="a-name" placeholder="企业名称" value="Agent演示企业">
  <button onclick="register()">注册</button>
  <button onclick="login()">登录</button>
</div>
<div>
  <input id="p-name" placeholder="项目名称" value="Agent演示项目">
  <button onclick="createProject()">创建项目</button>
</div>
<div>
  <input type="file" id="f-file">
  <button onclick="upload()">上传采购文件</button>
</div>
<div>
  <button onclick="agentRun()">▶ Agent 主会话（端到端）</button>
  <button onclick="agentRunResume()">↻ 续跑上次主会话</button>
  <button onclick="refreshTask()">刷新任务状态</button>
  <button onclick="openConsole()">打开会话控制台</button>
  <button onclick="downloadPackage()">下载响应文件包</button>
</div>
<hr>
<h2>历史中标价行情库（公共共建库 + 本企业私有库，联合查询 / xlsx 共建导入）</h2>
<div>
  <input id="hl-cat" placeholder="品类关键词（如：调控云）" style="width:220px">
  <input id="hl-pub" placeholder="发布单位关键词" style="width:220px">
  <select id="hl-scope" style="padding:6px;margin:4px">
    <option value="all">全部（公共+私有）</option>
    <option value="public">仅公共库</option>
    <option value="private">仅私有库</option>
  </select>
  <select id="hl-mode" style="padding:6px;margin:4px">
    <option value="">报价方式（不限）</option>
    <option value="折扣率">折扣率</option>
    <option value="固定总价">固定总价</option>
    <option value="比例报价">比例报价</option>
    <option value="系数报价">系数报价</option>
  </select>
  <button onclick="historyQuery()">查询行情库</button>
</div>
<div>
  <input type="file" id="hl-file" accept=".xlsx">
  <select id="hl-target" style="padding:6px;margin:4px">
    <option value="public">导入到公共库（全平台共建可见）</option>
    <option value="private">导入到本企业私有库</option>
  </select>
  <button onclick="historyImport()">导入 xlsx（限价↔中标价明细）</button>
</div>
<div id="hl-out" style="background:#fff;border:1px solid #d9e2ec;border-radius:8px;padding:10px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;max-height:420px;overflow:auto;display:none"></div>

<hr>
<h2>会话控制台（服务 ↔ Hermes 主会话 全量消息；可直接对话）</h2>
<div>
  <input id="c-msg" placeholder="给主会话发消息（任务完成后可对话）" style="width:520px">
  <button onclick="chatSend()">发送</button>
  <label style="margin-left:14px;user-select:none">
    <input type="checkbox" id="c-condensed" onchange="renderConsole()"> 精简视图
    <span title="过滤状态噪音（进度条/中断提示/思考动画/画框线），与交付包内『主会话记录-精简版.md』同一套规则">ⓘ</span>
  </label>
  <button onclick="consoleClose()">关闭控制台</button>
</div>
<div id="console" style="display:none;background:#10202f;color:#cfe6f8;padding:12px;border-radius:8px;font:12px/1.7 Consolas,monospace;white-space:pre-wrap;min-height:260px;max-height:520px;overflow:auto"></div>
<hr>
<div id="log">就绪。此页面只调用新接口 /agent-run（task_type=agent_pipeline），与旧流程接口隔离。</div>
<script>
let token = localStorage.getItem("bidvolt_agent_token") || "";
let projectId = localStorage.getItem("bidvolt_agent_pid") || "";
let taskId = localStorage.getItem("bidvolt_agent_task") || "";
let consoleSeq = 0;
let consoleAbort = null;
let bannerState = "idle"; // running | final
let lastTaskId = localStorage.getItem("bidvolt_agent_last_task") || "";
const BASE = location.origin;

function log(s){document.getElementById("log").innerText += "\n" + s;}

/* 结果横幅：任务终态时置顶展示，一眼可见 闭环/未闭环/失败 */
function showBanner(kind, text){
  const el = document.getElementById("banner");
  el.style.display = "block";
  if(kind === "complete"){
    el.style.background = "#e8f7ec"; el.style.color = "#1e6b34"; el.style.border = "2px solid #2f9e54";
  } else if(kind === "incomplete"){
    el.style.background = "#fdf3e0"; el.style.color = "#8a5a00"; el.style.border = "2px solid #d98a00";
  } else if(kind === "failed"){
    el.style.background = "#fdeaea"; el.style.color = "#a02727"; el.style.border = "2px solid #d64545";
  } else {
    el.style.background = "#eef2f7"; el.style.color = "#3f5f85"; el.style.border = "2px solid #7a93b5";
  }
  el.innerText = text;
  el.scrollIntoView();
}

/* 运行中横幅实时动态条：从事件流抽取主会话里程碑（不冒充精确百分比） */
const MILESTONE = /plan\s+\d+\s+task|delegate_task|🔀|Background task|ASYNC DELEGATION|验收|评审|通过|PIPELINE|save_deliverable|create_deliverable|upsert_requirements|未闭环|待补充/;
const SKIP_LINE = /^⚕|msg=interrupt|^\s*[0-9]+\s*$/;

function tickerUpdate(kind, content){
  if(bannerState !== "running") return;
  if(kind !== "hermes") return;
  const c = (content || "").trim();
  if(!c || SKIP_LINE.test(c) || !MILESTONE.test(c)) return;
  const line = c.length > 130 ? c.slice(0, 130) + "…" : c;
  const el = document.getElementById("banner");
  el.style.background = "#eef2f7"; el.style.color = "#3f5f85"; el.style.border = "2px solid #7a93b5";
  el.innerText = "⏳ 主会话运行中 · 最新动态：" + line;
}

function bannerFromEnd(d){
  bannerState = "final";
  if(d.error){
    const msg = (d.error && d.error.message) ? d.error.message : JSON.stringify(d.error);
    showBanner("failed", "❌ 任务执行失败：" + msg);
  } else if(d.outcome === "complete"){
    showBanner("complete", "✅ 主会话完成：全部验收门通过，交付件已落库。会话记录随响应文件包交付。");
  } else if(d.outcome === "incomplete"){
    showBanner("incomplete", "⚠ 主会话如实判定【未闭环】：\n" + (d.reason || "详见会话记录") + "\n补齐硬约束后可重新发起 agent-run。");
  } else if(d.status === 3){
    showBanner("complete", "✅ 任务结束（status=3）。");
  } else {
    showBanner("info", "任务终态：status=" + d.status);
  }
}

const KIND_LABEL = {
  service: "🔵 服务 → 主会话",
  hermes:  "🟢 主会话",
  tool:    "🔧 工具/委派",
  error:   "🔴 错误",
  user:    "👤 客户 → 主会话",
};

let consoleEvents = [];

/* 精简视图噪音行判定（与后端 session_record 精简版同一套规则） */
const NOISE_LINE = [/^⚕/, /^❯/, /^\(°ロ°\)/, /^\(⌐■_■\)/, /^\(¬_¬\)/, /^╭─/, /^╰─/, /^┌─/, /^└/, /^[│╭╰╞┌└─═]+$/];
const BOX_CHARS = "█░╭╮╰╯│┤┐┌└┘─═╞╡┴┬├";
function isNoiseLine(s){
  s = (s || "").trim();
  if(!s) return false;
  for(const re of NOISE_LINE){ if(re.test(s)) return true; }
  if(/^┊ (⚡|🔀|💻) preparing/.test(s) || /^(⚡ mcp__|💻|🔀)/.test(s)) return false;
  const body = s.split("").filter(ch => ch !== " ");
  if(body.length){
    let n = 0;
    for(const ch of body){ if(BOX_CHARS.includes(ch)) n++; }
    if(n / body.length > 0.55) return true;
  }
  return false;
}
function eventVisible(content){
  if(!document.getElementById("c-condensed").checked) return true;
  const lines = String(content || "").split("\n").filter(l => l.trim());
  if(!lines.length) return true;
  return !lines.every(isNoiseLine);
}

function renderConsole(){
  const el = document.getElementById("console");
  const condensed = document.getElementById("c-condensed").checked;
  let out = "";
  let hidden = 0;
  for(const e of consoleEvents){
    if(condensed && !eventVisible(e.content)){ hidden++; continue; }
    let head = KIND_LABEL[e.kind] || e.kind;
    if(e.kind === "service" && /催办|系统提示|判定|未闭环|续跑/.test(e.content || "")){
      head = "🔔 " + head;
    }
    out += `\n\n=== ${head} [seq ${e.seq}] ===\n${e.content}`;
  }
  if(condensed && hidden) out += `\n\n……（精简视图已过滤 ${hidden} 条噪音事件；取消勾选查看全量原始记录）`;
  el.innerText = out;
  el.scrollTop = el.scrollHeight;
}

function consoleAppend(seq, kind, content){
  consoleEvents.push({seq, kind, content});
  consoleSeq = Math.max(consoleSeq, seq || 0);
  renderConsole();
}

async function openConsole(){
  const el = document.getElementById("console");
  el.style.display = "block";
  consoleEvents = [];
  el.innerText = "";
  if(!taskId){ log("还没有任务，先点 Agent 主会话"); return; }
  if(consoleAbort) consoleAbort.abort();
  consoleAbort = new AbortController();
  log("控制台已打开：补发历史事件 + 实时推送…");
  try{
    const resp = await fetch(`${BASE}/api/v1/projects/${projectId}/agent-run/${taskId}/stream?since=${consoleSeq}`, {
      headers: {"Authorization": "Bearer " + token}, signal: consoleAbort.signal,
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for(const part of parts){
        const m = part.match(/^event: (\w+)\ndata: (.+)$/);
        if(!m) continue;
        if(m[1] === "end"){
          const d = JSON.parse(m[2]);
          consoleAppend(0, "service", "会话结束。status=" + d.status + " session_id=" + (d.session_id || ""));
          bannerFromEnd(d);
          return;
        }
        if(m[1] === "message"){
          const d = JSON.parse(m[2]);
          consoleAppend(d.seq, d.kind, d.content);
          tickerUpdate(d.kind, d.content);
        }
      }
    }
  }catch(e){
    if(e.name !== "AbortError") log("控制台流错误: " + e);
  }
}

function consoleClose(){
  if(consoleAbort) consoleAbort.abort();
  consoleAbort = null;
  document.getElementById("console").style.display = "none";
}

async function chatSend(){
  const msg = document.getElementById("c-msg").value.trim();
  if(!msg){log("先输入消息");return;}
  if(!taskId){log("还没有任务");return;}
  consoleAppend(++consoleSeq, "user", msg);
  try{
    const d = await api("POST", `/api/v1/projects/${projectId}/agent-run/${taskId}/chat`, {message: msg});
    if(d.queued){
      log("已送达主会话队列（当前轮结束后处理，回复会出现在控制台）");
      document.getElementById("c-msg").value = "";
      return;
    }
    consoleAppend(++consoleSeq, "hermes", d.reply || "(空回复)");
    log("主会话已回复（session_id=" + d.session_id + "）");
    document.getElementById("c-msg").value = "";
  }catch(e){
    consoleAppend(++consoleSeq, "error", String(e.message || e));
  }
}

async function api(method, path, body){
  const resp = await fetch(BASE + path, {method, headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body: body?JSON.stringify(body):undefined});
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error(data.detail || (resp.status + " " + resp.statusText));
  return data;
}

async function register(){
  const email = "agent-" + Date.now() + "@test.com";
  document.getElementById("a-email").value = email;
  const d = await api("POST","/api/v1/auth/register",{email,password:document.getElementById("a-pwd").value,enterprise_name:document.getElementById("a-name").value});
  token = d.access_token; localStorage.setItem("bidvolt_agent_token", token);
  log("注册成功 " + email);
}
async function login(){
  const d = await api("POST","/api/v1/auth/login",{email:document.getElementById("a-email").value,password:document.getElementById("a-pwd").value});
  token = d.access_token; localStorage.setItem("bidvolt_agent_token", token);
  log("登录成功");
}
async function createProject(){
  const d = await api("POST","/api/v1/projects",{name:document.getElementById("p-name").value});
  projectId = d.project_id; localStorage.setItem("bidvolt_agent_pid", String(projectId));
  log("项目创建 #" + projectId);
}
async function upload(){
  const f = document.getElementById("f-file").files[0];
  if(!f){log("先选文件");return;}
  const fd = new FormData();
  fd.append("target","project"); fd.append("project_id", String(projectId)); fd.append("files", f);
  const resp = await fetch(BASE + "/api/v1/files/upload", {method:"POST", headers:{"Authorization":"Bearer "+token}, body:fd});
  const d = await resp.json();
  log("上传: " + JSON.stringify(d).slice(0,200));
}
async function agentRun(){
  const d = await api("POST", `/api/v1/projects/${projectId}/agent-run`, {idempotency_key: "agent-" + Date.now(), payload:{}});
  startRun(d);
}
async function agentRunResume(){
  if(!lastTaskId){ log("没有可续跑的任务（先跑一单）"); return; }
  const d = await api("POST", `/api/v1/projects/${projectId}/agent-run`, {idempotency_key: "agent-" + Date.now(), payload:{}, resume_from_task_id: Number(lastTaskId)});
  log("已发起续跑：沿用上一单会话（resume_session_id=" + (d.resume_session_id || "") + "）");
  startRun(d);
}
function startRun(d){
  taskId = d.task_id; localStorage.setItem("bidvolt_agent_task", String(taskId));
  lastTaskId = String(taskId); localStorage.setItem("bidvolt_agent_last_task", lastTaskId);
  log("Agent 主会话任务 #" + taskId + " 已提交（task_type=agent_pipeline）");
  bannerState = "running";
  showBanner("info", "⏳ 主会话启动中…");
  openConsole(); // 自动打开控制台：事件流实时展示 + 驱动运行横幅动态条
  poll();
}
async function poll(){
  while(taskId){
    await new Promise(r=>setTimeout(r,8000));
    const d = await api("GET", `/api/v1/projects/${projectId}/agent-run/${taskId}`);
    const prog = d.progress || {};
    log(`任务 #${taskId} status=${d.status} ${prog.current_work || ""}`);
    if(d.result && d.result.session_id) log("会话 session_id=" + d.result.session_id + "（可恢复）");
    if([3,4,5,6].includes(d.status)){
      bannerFromEnd({status: d.status, error: d.error, outcome: d.result && d.result.outcome, reason: d.result && d.result.reason, session_id: d.result && d.result.session_id});
      break;
    }
  }
}
async function refreshTask(){
  if(!taskId){log("还没有任务");return;}
  const d = await api("GET", `/api/v1/projects/${projectId}/agent-run/${taskId}`);
  log(JSON.stringify(d).slice(0,800));
  if([3,4,5,6].includes(d.status)){
    bannerFromEnd({status: d.status, error: d.error, outcome: d.result && d.result.outcome, reason: d.result && d.result.reason, session_id: d.result && d.result.session_id});
  }
}
async function downloadPackage(){
  if(!projectId){log("先创建项目");return;}
  const resp = await fetch(BASE + `/api/v1/projects/${projectId}/response-package`, {headers:{"Authorization":"Bearer "+token}});
  if(!resp.ok){log("下载失败: " + resp.status);return;}
  const blob = await resp.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "响应文件包.zip";
  a.click();
  log("响应文件包已下载 " + blob.size + " B");
}
async function historyQuery(){
  const p = new URLSearchParams();
  const cat = document.getElementById("hl-cat").value.trim();
  const pub = document.getElementById("hl-pub").value.trim();
  const mode = document.getElementById("hl-mode").value;
  if(cat) p.set("category", cat);
  if(pub) p.set("publisher", pub);
  if(mode) p.set("price_mode", mode);
  p.set("scope", document.getElementById("hl-scope").value);
  p.set("limit", "50");
  const d = await api("GET", "/api/v1/quotes/history?" + p.toString());
  const out = document.getElementById("hl-out");
  out.style.display = "block";
  let txt = `共 ${d.sample_count} 条样本\n`;
  for(const st of (d.stats||[])){
    txt += `  [${st.price_mode}] ${st.count} 条，中标价区间 ${(st.win_price_range||[]).join(" ~ ")}\n`;
  }
  for(const s of (d.samples||[])){
    txt += `\n${s.source === "public" ? "【公共】" : "【私有】"} ${s.notice_id || ""}\n  品类: ${s.category||"-"}  包名: ${s.package_name||"-"}\n  发布: ${s.publisher||"-"}  ${s.publish_date||""}  方式: ${s.price_mode}\n  限价: ${s.limit_price ?? "-"}  中标价: ${s.win_price}  比值: ${s.win_ratio ?? "-"}\n  中标证据: ${s.win_evidence_url || s.win_evidence || "-"}`;
  }
  out.innerText = txt;
}
async function historyImport(){
  const f = document.getElementById("hl-file").files[0];
  if(!f){log("先选 xlsx 文件");return;}
  const fd = new FormData();
  fd.append("target", document.getElementById("hl-target").value);
  fd.append("file", f);
  const resp = await fetch(BASE + "/api/v1/quotes/history/import", {method:"POST", headers:{"Authorization":"Bearer "+token}, body:fd});
  const d = await resp.json();
  if(resp.ok){
    log(`行情导入完成：入库 ${d.imported} 条（解析 ${d.parsed_total}，跳过 ${d.skipped_rows}），范围 ${d.scope}`);
    historyQuery();
  } else {
    log("导入失败: " + resp.status + " " + JSON.stringify(d).slice(0,300));
  }
}
</script>
</body>
</html>
